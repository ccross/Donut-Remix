openapi: 3.0.3
info:
  title: Donut Remix REST API
  description: Modern, secure REST API for RetroTINK 4K profile automation, serial control, and console GameID detection.
  version: 1.0.0
  license:
    name: GNU General Public License v3.0
    url: https://www.gnu.org/licenses/gpl-3.0.en.html

servers:
  - url: http://donutshop.local
    description: Default local mDNS hostname
  - url: http://{ip}
    description: Direct device IP address
    variables:
      ip:
        default: 192.168.1.100
        description: LAN IP of Donut Remix ESP32

paths:
  /api/v1/auth/login:
    post:
      summary: Authenticate Admin Session
      description: Logs in using the admin password and generates an authenticated session token. Subject to brute-force rate limiting (5 attempts per minute).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  example: "donutremix"
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: "4a2b9f01e7c538209ad43bf1e02947ac"
                  expiresIn:
                    type: integer
                    example: 86400
        '401':
          description: Invalid password
        '429':
          description: Rate limited due to too many failed attempts

  /api/v1/auth/logout:
    post:
      summary: Invalidate Session
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: Session revoked

  /api/v1/auth/status:
    get:
      summary: Authentication Policy Status
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  authRequired:
                    type: boolean

  /api/v1/status:
    get:
      summary: System & RT4K Telemetry
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  uptime:
                    type: integer
                    description: Uptime in seconds
                  active_profile:
                    type: integer
                    description: Currently loaded SVS profile or negative remote profile
                  active_console:
                    type: string
                    description: Console currently driving profile changes
                  rt4k_status:
                    type: string

  /api/v1/consoles:
    get:
      summary: List Configured Consoles
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Console'
    post:
      summary: Update Consoles Configuration
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 16
              items:
                $ref: '#/components/schemas/ConsoleInput'
      responses:
        '200':
          description: Consoles saved successfully
        '400':
          description: Validation error or URL rejected by guardrails

  /api/v1/gamedb:
    get:
      summary: List GameID Database Mappings
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  type: array
                  items:
                    type: string
    post:
      summary: Update GameID Database Mappings
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 2000
              items:
                $ref: '#/components/schemas/GameDBEntry'
      responses:
        '200':
          description: Game database updated

  /api/v1/vars:
    get:
      summary: Get System Variables
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemVars'
    post:
      summary: Update System Variables
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemVars'
      responses:
        '200':
          description: System variables updated

  /api/v1/command:
    post:
      summary: Send Command to RT4K, Matrix, or IR
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [command]
              properties:
                command:
                  type: string
                  example: "remote prof1"
      responses:
        '200':
          description: Command dispatched
        '400':
          description: Command rejected by sanitization guardrails

  /api/v1/system/backup:
    get:
      summary: Export Configuration Backup
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: JSON configuration dump

  /api/v1/system/restore:
    post:
      summary: Restore Configuration Backup
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Backup restored

  /api/v1/system/update:
    post:
      summary: Authenticated Firmware Flash
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                update:
                  type: string
                  format: binary
      responses:
        '200':
          description: Flash completed; device rebooting

  /api/v1/rt4k/status:
    get:
      summary: Microcontroller RT4K Status
      description: Returns lightweight, compact status information tailored for ESP32 CYD dashboards.
      responses:
        '200':
          description: Status retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  connected:
                    type: boolean
                  active_profile:
                    type: string
                  active_console:
                    type: string
                  uptime:
                    type: integer
                  free_heap:
                    type: integer
                  rt4k_baud:
                    type: integer

  /api/v1/rt4k/remote:
    post:
      summary: Send Remote Button
      description: Dispatches a remote control keypress to the RT4K over USB CDC.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [button]
              properties:
                button:
                  type: string
                  example: "menu"
      responses:
        '200':
          description: Button sent

  /api/v1/rt4k/profile:
    post:
      summary: Switch RT4K Profile
      description: Selects active RT4K profile by profile index, SVS input number, remote button, or SD path.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                profile:
                  type: integer
                svs:
                  type: integer
                button:
                  type: integer
                name:
                  type: string
      responses:
        '200':
          description: Profile switched

  /api/v1/rt4k/exec:
    post:
      summary: Synchronous RT4K Command Exec
      description: Runs a command over RT4K USB CDC synchronously and returns the live response output.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cmd]
              properties:
                cmd:
                  type: string
                  example: "prof"
      responses:
        '200':
          description: Command executed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  cmd:
                    type: string
                  response:
                    type: string

  /api/v1/svs/status:
    get:
      summary: SVS Hardware Status & Serial Logs
      description: Returns real-time status of the attached Scalable Video Switch, including active channel, total channels, power state, and circular buffer serial logs.
      responses:
        '200':
          description: SVS telemetry and recent serial log entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SvsStatusResponse'

  /api/v1/svs/input:
    post:
      summary: Switch SVS Input Channel
      description: Selects active SVS video input (0-32).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [input]
              properties:
                input:
                  type: integer
                  minimum: 0
                  maximum: 32
                  example: 1
      responses:
        '200':
          description: Input switched
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  input:
                    type: integer

  /api/v1/svs/seek:
    post:
      summary: Seek SVS Input with Active Signal
      description: Seeks to the next or previous channel that has an active video signal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                dir:
                  type: string
                  enum: [up, down]
                  default: up
      responses:
        '200':
          description: Seek initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  direction:
                    type: string

  /api/v1/svs/power:
    post:
      summary: Set SVS Power State
      description: Toggles SVS power state between operational and standby.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                power:
                  type: boolean
                  default: true
      responses:
        '200':
          description: Power updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  power:
                    type: boolean

  /api/v1/svs/command:
    post:
      summary: Send Raw SVS Serial Command
      description: Sends a guardrail-sanitized command directly to the SVS hardware and returns the response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cmd]
              properties:
                cmd:
                  type: string
                  example: "SVS_Attract_Mode"
      responses:
        '200':
          description: Command executed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  command:
                    type: string
                  response:
                    type: string
                  bytesWritten:
                    type: integer

  /api/v1/svs/modules:
    get:
      summary: Query SVS Transcoder Output Modules
      description: Returns state of installed transcoder output modules (RGB-to-Comp, Comp-to-RGB, RGsB, Sync Bypass).
      parameters:
        - name: refresh
          in: query
          schema:
            type: boolean
          description: Force immediate hardware re-query
      responses:
        '200':
          description: Module states
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SvsModulesResponse'
    post:
      summary: Configure SVS Transcoder Modules
      description: Enable, disable, or toggle output module transcoders for an input channel.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                input:
                  type: integer
                  minimum: 1
                  maximum: 32
                type:
                  type: string
                  enum: [rgb_to_comp, comp_to_rgb, rgsb, sync_bypass]
                enable:
                  type: boolean
                action:
                  type: string
                  enum: [toggle_rgb_to_comp, toggle_comp_to_rgb, toggle_rgsb, toggle_sync_bypass]
      responses:
        '200':
          description: Updated module states
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SvsModulesResponse'

  /webctl-theme:
    get:
      summary: Get Web UI Theme
      description: Returns current UI theme.
      responses:
        '200':
          description: Theme info
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  theme:
                    type: string
                    enum: [dark, light]
    post:
      summary: Set and Persist Web UI Theme
      description: Sets UI theme and persists it to NVS.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                theme:
                  type: string
                  enum: [dark, light]
      responses:
        '200':
          description: Theme updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  theme:
                    type: string

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Session-Token

  schemas:
    Console:
      type: object
      properties:
        Desc:
          type: string
        Address:
          type: string
        DefaultProf:
          type: integer
        Enabled:
          type: boolean
        On:
          type: boolean
        King:
          type: boolean

    ConsoleInput:
      type: object
      required: [Desc, Address, DefaultProf]
      properties:
        Desc:
          type: string
          maxLength: 64
        Address:
          type: string
          maxLength: 256
        DefaultProf:
          type: integer
          minimum: -12
          maximum: 999
        Enabled:
          type: boolean
          default: true

    GameDBEntry:
      type: object
      required: [name, gameID, profile]
      properties:
        name:
          type: string
        gameID:
          type: string
        profile:
          type: string

    SystemVars:
      type: object
      properties:
        S0:
          type: boolean
        SRS:
          type: integer
        offset:
          type: integer
        hostname:
          type: string

    SvsStatusResponse:
      type: object
      properties:
        connected:
          type: boolean
        firmware:
          type: string
        current_input:
          type: integer
        total_inputs:
          type: integer
        power:
          type: boolean
        attract:
          type: boolean
        manual:
          type: boolean
        uptime:
          type: integer
        cdc_connected:
          type: boolean
        usb_host_ready:
          type: boolean
        svs_connected:
          type: boolean
        rt4k_baud:
          type: integer
        usb_device_count:
          type: integer
        usb_devices:
          type: array
          items:
            type: object
            properties:
              vid:
                type: integer
              pid:
                type: integer
              addr:
                type: integer
              mfg:
                type: string
              prod:
                type: string
        last_cmd:
          type: string
        last_bytes_written:
          type: integer
        last_rx:
          type: string
        serial_log:
          type: array
          items:
            type: object
            properties:
              t:
                type: integer
                description: Timestamp in ms
              d:
                type: string
                description: Direction (T or R)
              m:
                type: string
                description: Log message

    SvsModulesResponse:
      type: object
      properties:
        ok:
          type: boolean
        total_inputs:
          type: integer
        current_input:
          type: integer
        rgb_to_comp:
          type: array
          items:
            type: boolean
        comp_to_rgb:
          type: array
          items:
            type: boolean
        rgsb:
          type: array
          items:
            type: boolean
        sync_bypass:
          type: array
          items:
            type: boolean
