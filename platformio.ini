[platformio]
default_envs = nano_esp32

[env:nano_esp32]
platform = espressif32
board = arduino_nano_esp32
framework = arduino
monitor_speed = 115200

build_src_filter =
    +<DonutRemix.ino>
    +<src/*>
    -<DonutShop.ino>
    -<DonutShop_usb-only-test.ino>
    -<tests/*>
    -<install/*>

lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    tzapu/WiFiManager@^2.0.17
    z3t0/IRremote@^4.4.1
    tanakamasayuki/EspUsbHost@2.7.9

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSB_MODE=1
